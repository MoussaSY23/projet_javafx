name: CI/CD Pipeline

on:
  push:
    branches:
      - Sy_Moussa_emargement  # Branche spécifique
  pull_request:
    branches:
      - Sy_Moussa_emargement

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Cloner le dépôt
      uses: actions/checkout@v4

    - name: Installer Java et Maven
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build Maven
      run: mvn clean install

    - name: Construction de l'image Docker
      run: docker build -t MoussaSy/projet_exam:latest .

    - name: Connexion à DockerHub
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    - name: Pousser l'image sur DockerHub
      run: docker push MoussaSy/projet_exam:latest
